name: CI

# Pull requests: checks only. Push to master: checks → push server → web app.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs can go; a deploy on master is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  # The push server first: the new web app may rely on its new API.
  worker:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    env:
      # A Cloudflare API token with Workers Scripts: Edit and D1: Edit (see README).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails the run (and stops the web deploy) if a migration fails.
      - name: Apply D1 migrations
        run: npm run db:migrate:remote -w @tuktuk/worker
      - name: Deploy worker
        run: npm run deploy -w @tuktuk/worker
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://tuktuk.tuktuk-worker.workers.dev/health

  web-build:
    if: github.event_name != 'pull_request'
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # Project pages live under /<repo>/, so assets need that base path.
      - run: npm run build -w @tuktuk/web -- --base=${{ steps.pages.outputs.base_path }}/

      # SPA fallback: Pages serves 404.html for unknown paths, so deep links like /settings work.
      - run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  web-deploy:
    needs: web-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
